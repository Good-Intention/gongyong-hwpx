# 릴리스를 내면(Publish release) 그 태그로 시험을 돌린 뒤
#  - gongyong-hwpx.skill이 아직 안 붙어 있으면 묶어서 붙이고,
#  - 손으로 붙여 두었으면 그 파일이 태그의 스킬 폴더와 내용이 같은지 대조한다(다르면 실패로 알림).
name: 릴리스 스킬 파일

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "대조·첨부할 릴리스 태그(예: v1.25)"
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 필요한 것 설치
        run: pip install lxml
      - name: 시험
        run: python -m unittest discover -s tests -v
      - name: 붙이거나 대조하기
        run: |
          python tools/package_skill.py
          if gh release download "$TAG" --pattern gongyong-hwpx.skill --dir attached 2>/dev/null; then
            echo "붙어 있는 파일을 태그 $TAG 의 스킬 폴더와 대조합니다"
            python tools/package_skill.py --compare attached/gongyong-hwpx.skill
          else
            echo "붙어 있지 않아 묶은 파일을 붙입니다"
            gh release upload "$TAG" dist/gongyong-hwpx.skill
          fi
          sha256sum dist/gongyong-hwpx.skill
